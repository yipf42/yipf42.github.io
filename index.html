<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title>呼吸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫁</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="scene">
  <button id="gear" aria-label="设置">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"/>
    </svg>
  </button>

  <div id="circle-wrap">
    <div id="circle"></div>
    <div id="circle-text">
      <div id="phase-label"></div>
      <div id="phase-count"></div>
    </div>
  </div>

  <p id="timer"></p>
  <p id="hint">轻触任意处开始</p>
</main>

<div id="backdrop"></div>
<aside id="drawer">
  <h2>设置</h2>
  <section>
    <h3>模式</h3>
    <div id="mode-options"></div>
  </section>
  <section>
    <h3>时长</h3>
    <div id="duration-options" class="seg"></div>
  </section>
  <section class="toggles">
    <label><span>声音提示</span><input type="checkbox" id="sound-toggle"></label>
    <label><span id="vibrate-label">震动提示</span><input type="checkbox" id="vibrate-toggle"></label>
  </section>
  <button id="drawer-done">完成</button>
</aside>

<div id="done-overlay">
  <div id="done-card">
    <p id="done-title">完成</p>
    <p id="done-detail"></p>
    <button id="again">再来一次</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
